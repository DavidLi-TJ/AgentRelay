name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # 便携包：官方 node.exe + 源码 + 启动脚本（解压即用，无需安装 Node）
      - name: Build portable zip
        run: node scripts/make-portable.js
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-v$(node -p "require('./package.json').version")}"
          "C:/Program Files/GitHub CLI/gh.exe" release create "$TAG" \
            dist/*.zip \
            --title "AgentRelay $TAG" \
            --notes "便携版：解压后双击 StartAgentRelay.bat，无需安装 Node.js。源码用户照旧 npx github:DavidLi-TJ/AgentRelay serve。"
